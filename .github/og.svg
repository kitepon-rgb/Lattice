<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Yu Gothic UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#141a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="22%" r="62%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Lattice mark: a contested node split into two independent surfaces -->
  <g transform="translate(950, 150)">
    <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.55">
      <line x1="0" y1="-46" x2="-72" y2="34"/>
      <line x1="0" y1="-46" x2="72" y2="34"/>
      <line x1="-72" y1="34" x2="72" y2="34" stroke-dasharray="5 6"/>
    </g>
    <circle cx="0" cy="-46" r="15" fill="#0a0e1a" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="-72" cy="34" r="19" fill="#0a0e1a" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="72" cy="34" r="19" fill="#0a0e1a" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="-72" cy="34" r="6" fill="#38bdf8"/>
    <circle cx="72" cy="34" r="6" fill="#38bdf8"/>
  </g>

  <!-- Project name -->
  <text x="80" y="196" fill="#ffffff" font-size="122" font-weight="700" letter-spacing="-4">Lattice</text>

  <!-- Pitch -->
  <text x="80" y="272" fill="#e2e8f0" font-size="38" font-weight="600">Stop serializing work that only</text>
  <text x="80" y="324" fill="#e2e8f0" font-size="38" font-weight="600">
    <tspan>looks</tspan><tspan fill="#38bdf8"> like it conflicts.</tspan>
  </text>

  <text x="80" y="392" fill="#94a3b8" font-size="27">A schedulability compiler for multi-agent development:</text>
  <text x="80" y="432" fill="#94a3b8" font-size="27">observe real boundaries, refactor the seam, recompile the plan.</text>

  <!-- Pipeline strip -->
  <g transform="translate(80, 496)" font-size="21" font-weight="600">
    <rect x="0" y="0" width="186" height="50" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="93" y="32" fill="#cbd5e1" text-anchor="middle">observe</text>
    <text x="204" y="32" fill="#475569">→</text>

    <rect x="232" y="0" width="186" height="50" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="325" y="32" fill="#cbd5e1" text-anchor="middle">detect conflict</text>
    <text x="436" y="32" fill="#475569">→</text>

    <rect x="464" y="0" width="186" height="50" rx="10" fill="#1e293b" stroke="#38bdf8"/>
    <text x="557" y="32" fill="#38bdf8" text-anchor="middle">transform</text>
    <text x="668" y="32" fill="#475569">→</text>

    <rect x="696" y="0" width="186" height="50" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="789" y="32" fill="#cbd5e1" text-anchor="middle">recompile</text>
  </g>

  <text x="80" y="592" fill="#64748b" font-size="20">Patent pending — JP 2026-178950</text>
</svg>
