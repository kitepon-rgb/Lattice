name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    strategy:
      fail-fast: false
      matrix:
        environment: [macos-native, linux-native, windows-native, wsl2]
    timeout-minutes: 15
    runs-on: [self-hosted, factory, "${{ matrix.environment }}"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22.22.3'
      - run: npm ci
      - run: npm --prefix sensor ci
      - run: npm --prefix sensor run build
      - run: npm run test:profile -- --profile=core
      - run: npm run test:sensor
      - run: npm run check
      - run: npm run check:cli-surface
      - run: npm run check:open-questions
      - run: npm run check:reachability
      - run: npm run verify:todo-store
