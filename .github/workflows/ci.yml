name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 実行する工場環境
        type: choice
        default: all
        options: [all, macos-native, linux-native, windows-native, wsl2]

permissions:
  contents: read

jobs:
  full:
    uses: kitepon/dotagents/.github/workflows/factory-full-ci.yml@main
    with:
      environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'all' }}
      dependency-command: npm ci && npm --prefix sensor ci
      full-command: >-
        npm --prefix sensor run build &&
        npm run ci
