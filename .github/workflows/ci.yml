name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # portableな製品挙動、sensor、静的契約はLinuxで一度だけ完全検証する。
  core-linux:
    timeout-minutes: 12
    runs-on: [self-hosted, factory, linux-native]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci
      - run: npm --prefix sensor ci
      - run: npm --prefix sensor run build
      - run: npm run test:profile -- --profile=core
      - run: npm run test:sensor
      - run: npm run check
      - run: npm run check:cli-surface
      - run: npm run check:open-questions
      - run: npm run check:reachability
      - run: npm run verify:todo-store

  # macOS固有のlaunchd、process lifecycle、実path/filesystem境界だけを実測する。
  macos-native:
    timeout-minutes: 8
    runs-on: [self-hosted, factory, macos-native]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci
      - run: npm --prefix sensor ci
      - run: npm --prefix sensor run build
      - run: npm run test:profile -- --profile=macos

  # Windows native固有のStartup、NTFS、path、CLI境界だけを実測する。
  windows-native:
    timeout-minutes: 8
    runs-on: [self-hosted, factory, windows-native]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci
      - run: npm --prefix sensor ci
      - run: npm --prefix sensor run build
      - run: npm run test:profile -- --profile=windows

  # WSL2自身のext4上でgit、store、CLI、POSIX hooksの境界を実測する。
  wsl2:
    timeout-minutes: 8
    runs-on: [self-hosted, factory, wsl2]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci
      - run: npm run test:profile -- --profile=wsl2
